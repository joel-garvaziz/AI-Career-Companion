{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="min-h-[60vh] grid place-items-center px-4 py-16 text-center">
  <div class="max-w-md animate-pop">
    <p class="font-mono text-6xl font-semibold text-brand-600 tnum">{{ code }}</p>
    <h1 class="mt-4 font-display text-3xl">{{ title }}</h1>
    <p class="mt-2 muted">{{ message }}</p>
    <div class="mt-8 flex justify-center gap-3">
      <a href="{{ url_for('dashboard') if current_student else url_for('index') }}" class="btn btn-ink">{{ 'Go to Home' if current_student else 'Back to home' }}</a>
      <button onclick="history.back()" class="btn btn-white">Go back</button>
    </div>
  </div>
</div>
{% endblock %}
