{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="min-h-[78vh] grid place-items-center px-4 py-10">
  <div class="w-full max-w-md animate-pop">
    <div class="text-center">
      <span class="logo-mark float mx-auto !h-14 !w-14 !rounded-2xl"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
      <h1 class="mt-5 font-display text-3xl">Welcome back</h1>
      <p class="mt-1 muted">Log in to continue your search.</p>
    </div>
    <form method="post" class="card mt-8 p-7 space-y-5">
      <div><label class="lbl">Email</label><input class="input" name="email" type="email" required autofocus autocomplete="email" placeholder="you@example.com" value="{{ request.form.get('email', '') }}"></div>
      <div><label class="lbl">Password</label><input class="input" id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password"></div>
      <label class="flex items-center gap-2 text-sm muted"><input type="checkbox" class="h-4 w-4 accent-[#4338ca]" onclick="password.type=this.checked?'text':'password'"> Show password</label>
      <button class="btn btn-ink w-full !py-3.5">Log in</button>
    </form>
    <p class="mt-6 text-center text-sm muted">New here? <a class="font-semibold text-brand-600 hover:underline" href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
